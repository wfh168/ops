# ============================================
# Tmux 配置文件（优化版）
# ============================================

# -------------------- 基础设置 --------------------

# 前缀键改为 Ctrl+a（比 Ctrl+b 更顺手）
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 终端颜色支持
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'

# 响应速度优化（减少延迟）
set -sg escape-time 0

# 鼠标支持（关闭，使用键盘操作更高效）
set -g mouse off

# 剪贴板支持
set -g set-clipboard on

# 启用 Vi 复制模式（重要！）
setw -g mode-keys vi

# 窗口编号从 1 开始（0 太远）
set -g base-index 1
setw -g pane-base-index 1

# 自动重新编号窗口
set -g renumber-windows on

# 历史记录行数
set -g history-limit 10000

# -------------------- 复制模式（Vi 风格）--------------------

# Vi 风格的选择和复制
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# 与系统剪贴板集成（Linux - 需要安装 xclip）
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# 从系统剪贴板粘贴
bind C-p run "xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer"

# macOS 用户使用以下配置（注释掉上面的 Linux 配置）
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
# bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
# bind C-p run "pbpaste | tmux load-buffer - ; tmux paste-buffer"

# -------------------- 分屏快捷键 --------------------

# 垂直分割（| 更直观）
bind | split-window -h -c "#{pane_current_path}"

# 水平分割（- 更直观）
bind - split-window -v -c "#{pane_current_path}"

# 取消默认的分割键
unbind '"'
unbind %

# 新窗口在当前路径打开
bind c new-window -c "#{pane_current_path}"

# -------------------- 窗格切换（Vim 风格）--------------------

# 使用 hjkl 切换窗格
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 使用 Alt+hjkl 调整窗格大小（不需要前缀键）
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# -------------------- 窗口管理 --------------------

# 关闭窗格（需要确认）
bind x kill-pane

# 关闭窗口（需要确认）
bind X kill-window

# 在窗口选择模式中按 x 删除选中的窗口
bind -T window-mode-vi x confirm-before -p "kill window #I? (y/n)" kill-window

# 快速重载配置
bind r source-file ~/.tmux.conf \; display "配置已重载！"

# -------------------- 状态栏样式 --------------------

# 启用状态栏
set -g status on
set -g status-interval 2
set -g status-position top

# 状态栏颜色（GitHub Light 主题 - 浅色背景）
set -g status-style "bg=#f6f8fa,fg=#24292e"

# 窗格边框颜色（GitHub Light）
set -g pane-border-style "fg=#d1d5da"
set -g pane-active-border-style "fg=#0366d6"

# 消息样式（GitHub Light）
set -g message-style "bg=#f6f8fa,fg=#28a745"
set -g message-command-style "bg=#f6f8fa,fg=#dbab09"

# -------------------- 窗口列表样式 --------------------

# 普通窗口（灰色）
set -g window-status-format " #[fg=#6a737d]#I:#W "

# 当前窗口（蓝色高亮，浅蓝背景）
set -g window-status-current-format " #[bold,fg=#0366d6,bg=#c8e1ff]#I:#W* "

# -------------------- 状态栏左侧 --------------------

set -g status-left-length 80
set -g status-left " #[bold,fg=#ffffff,bg=#0366d6] #S #[fg=#24292e,bg=#f6f8fa] "

# -------------------- 状态栏右侧 --------------------

set -g status-right-length 200
set -g status-right "#[fg=#28a745]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null | sed 's/^/ /') #[fg=#d1d5da]│ #[fg=#24292e]#(~/.tmux/scripts/smart-status.sh) #[fg=#d1d5da]│ #[fg=#0366d6]%Y-%m-%d %H:%M "

# -------------------- 插件配置 --------------------

# CPU 显示格式（必须在插件加载前设置）
set -g @cpu_percentage_format "%3.0f%%"
set -g @ram_percentage_format "%3.0f%%"

# Resurrect 插件配置
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Continuum 插件配置（自动保存会话）
set -g @continuum-restore 'on'  # 开启自动恢复
set -g @continuum-save-interval '5'

# -------------------- 插件列表 --------------------

# TPM 插件管理器
set -g @plugin 'tmux-plugins/tpm'

# CPU 和内存显示
set -g @plugin 'tmux-plugins/tmux-cpu'

# 会话保存和恢复
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# -------------------- 启动 TPM --------------------

# 初始化 TPM（必须放在配置文件最后）
run '~/.tmux/plugins/tpm/tpm'
